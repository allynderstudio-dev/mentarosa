<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Invitación · Mentarosa</title>
<link rel="icon" href="/assets/logo-mentarosa-circle.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-page">
<main class="login">
  <div class="login-card">
    <img class="login-logo" src="/assets/logo-mentarosa-circle.png" alt="Mentarosa">
    <h1 id="title">Invitación</h1>
    <p class="login-sub" id="sub">Revisando tu invitación…</p>

    <div id="err" role="alert"></div>

    <div id="ok" hidden>
      <a class="btn google" id="google" href="#" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true" width="18" height="18"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Aceptar con Google
      </a>
      <div class="or" id="or" hidden><span>o crea una contraseña</span></div>
      <form id="form" novalidate>
        <label class="field"><span>Correo</span><input type="email" id="email" autocomplete="username" readonly></label>
        <label class="field"><span>Contraseña nueva</span><input type="password" id="p1" autocomplete="new-password" placeholder="mín. 10 caracteres"></label>
        <label class="field"><span>Repite la contraseña</span><input type="password" id="p2" autocomplete="new-password"></label>
        <button class="btn block" id="submit" type="submit">Aceptar invitación</button>
      </form>
    </div>
  </div>
  <a class="login-back" href="/admin/login">Ya tengo acceso → Iniciar sesión</a>
</main>
<script src="/admin/invite.js"></script>
</body>
</html>
